<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Arcane Rush: a portrait lane-defense auto-shooter." />
    <title>Arcane Rush</title>
  </head>
  <body>
    <canvas id="game-canvas" touch-action="none"></canvas>

    <div id="overlay-root">
      <!-- Title. scripts/smoke.mjs clicks #play-button; keep that id stable. -->
      <section id="title-screen" class="screen screen--menu">
        <div class="screen__inner">
          <div class="screen__top">
            <h1 class="screen__title">Arcane&nbsp;Rush</h1>
            <p class="screen__hint">Drag to move. Your squad fires by itself.</p>
          </div>

          <div class="screen__middle">
            <p class="picker__caption">Level</p>
            <!-- Filled by src/ui/overlay.ts from the save's unlocked level. -->
            <div id="level-picker" class="picker"></div>
          </div>

          <div class="screen__actions">
            <button id="play-button" class="button" type="button">Play</button>
          </div>
        </div>
      </section>

      <!-- HUD: informational only, so it never eats a drag (pointer-events: none). -->
      <section id="hud" class="screen screen--hud" hidden>
        <div class="screen__inner">
          <div class="hud__stack">
            <div class="hud__top">
              <div id="hud-level" class="hud__level">Level 1</div>
              <div id="hud-count" class="hud__count">0</div>
            </div>

            <div id="boss-bar" class="boss" hidden>
              <div class="boss__head">
                <span class="boss__label">Boss</span>
                <span id="boss-bar-value" class="boss__value">0 / 0</span>
              </div>
              <div class="boss__track"><div id="boss-bar-fill" class="boss__fill"></div></div>
            </div>
          </div>

          <p id="gate-legend" class="legend" hidden>
            Shoot gates to grow them:
            <b class="legend__add">+add</b>
            <b class="legend__mul">&times;mul</b>
            <b class="legend__sub">&minus;sub</b>
            <b class="legend__rate">&#9889;rate</b>
          </p>
        </div>
      </section>

      <!-- Result: survivors, peak count, Retry / Next. -->
      <section id="result-screen" class="screen screen--menu" hidden>
        <div class="screen__inner">
          <div class="screen__top">
            <p id="result-kicker" class="result__kicker">Run over</p>
            <h2 id="result-title" class="screen__title screen__title--result">Defeated</h2>
          </div>

          <div class="screen__middle">
            <dl class="stats">
              <div class="stats__row">
                <dt class="stats__key">Survivors</dt>
                <dd id="result-survivors" class="stats__value">0</dd>
              </div>
              <div class="stats__row">
                <dt class="stats__key">Peak squad</dt>
                <dd id="result-peak" class="stats__value">0</dd>
              </div>
            </dl>
          </div>

          <div class="screen__actions">
            <button id="next-button" class="button" type="button" hidden>Next</button>
            <button id="retry-button" class="button button--ghost" type="button">Retry</button>
            <button id="levels-button" class="button button--ghost" type="button">Levels</button>
          </div>
        </div>
      </section>

      <!-- ?debug only. Monospace, top-left, never interactive. -->
      <pre id="debug-panel" class="debug" hidden></pre>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
