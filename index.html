<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="color-scheme" content="light" />
    <meta name="description" content="Arcane Rush: a portrait lane-defense auto-shooter." />
    <title>Arcane Rush</title>
  </head>
  <body>
    <canvas id="game-canvas" touch-action="none"></canvas>

    <div id="overlay-root">
      <!--
        The Academy home, which replaced the title screen in Milestone 4
        (decision D33). It keeps the id `#title-screen` and the wordmark's
        `#title-wordmark`: the first is what every screen switch and the smoke
        test already know this screen by, and the second is a triple-tap target
        for the debug panel (src/ui/taps.ts).

        The room cards are built by src/ui/academy.ts from src/data/academy.json
        so the copy, the order and the unlock levels stay out of the markup.
      -->
      <section id="title-screen" class="screen screen--academy">
        <div class="screen__inner">
          <div class="academy__bar">
            <div id="academy-coins" class="coins">
              <span class="coins__icon" aria-hidden="true"></span>
              <span id="academy-coin-value" class="coins__value">0</span>
            </div>
          </div>

          <div class="screen__top">
            <h1 id="title-wordmark" class="screen__title">Arcane&nbsp;Rush</h1>
          </div>

          <!-- One frosted panel over the lit road, as on the old title: the
               dressed scene behind it is the shop window, and light-on-light
               was unreadable. Inert like the rest of the overlay; only the
               cards take pointer events. -->
          <div class="screen__panel">
            <div id="academy-cards" class="cards"></div>
          </div>
        </div>

        <!-- Mute lives here and in the HUD corner; both drive the save. -->
        <button
          id="mute-title"
          class="mute mute--title"
          type="button"
          aria-label="Sound"
          aria-pressed="false"
        >
          <svg class="mute__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path class="mute__horn" d="M4 9h4l5-4v14l-5-4H4z" />
            <path class="mute__wave" d="M16.2 8.4a5 5 0 0 1 0 7.2" />
            <path class="mute__wave" d="M18.6 6a8.5 8.5 0 0 1 0 12" />
            <path class="mute__slash" d="M4 3.5 21 20.5" />
          </svg>
        </button>
      </section>

      <!-- Level picker, behind the Academy's Play card. Two pages of ten; the
           page tabs hide themselves while there is only one page.
           scripts/smoke-run.mjs clicks #play-button — keep that id stable. -->
      <section id="levels-screen" class="screen screen--levels" hidden>
        <div class="screen__inner">
          <div class="screen__top">
            <h2 class="screen__title screen__title--panel">Levels</h2>
          </div>

          <div class="screen__panel">
            <div class="screen__middle">
              <p id="picker-caption" class="picker__caption">Level</p>
              <!-- Filled by src/ui/academy.ts from the save's unlocked level. -->
              <div id="level-picker" class="picker"></div>
              <div id="picker-pages" class="pager"></div>
            </div>

            <div class="screen__actions">
              <button id="play-button" class="button" type="button">Play</button>
              <button id="levels-back" class="button button--ghost" type="button">Back</button>
            </div>
          </div>
        </div>
      </section>

      <!-- The four rooms share one screen: the heading, the coin chip and the
           Back button are the same furniture, and only the body swaps. Each
           room's body is built once, on the first visit, by src/ui/rooms.ts. -->
      <section id="room-screen" class="screen screen--room" hidden>
        <div class="screen__inner">
          <div class="room__bar">
            <div id="room-coins" class="coins">
              <span class="coins__icon" aria-hidden="true"></span>
              <span id="room-coin-value" class="coins__value">0</span>
            </div>
          </div>

          <div class="screen__top">
            <h2 id="room-title" class="screen__title screen__title--panel">Yard</h2>
            <p id="room-subtitle" class="room__subtitle"></p>
          </div>

          <div class="screen__panel room__panel">
            <div id="yard-rows" class="rows" hidden></div>
            <div id="workbench-cards" class="rows" hidden></div>
            <div id="sanctum-card" class="rows" hidden></div>
            <div id="bestiary-cards" class="beasts" hidden></div>
          </div>

          <div class="screen__actions">
            <button id="room-back" class="button button--ghost" type="button">Back</button>
          </div>
        </div>
      </section>

      <!-- HUD: count, staff badge, boss bar, level chip, mute — and nothing
           else (docs/09-milestone-3-plan.md, "UI text, font"). Informational
           only, so it never eats a drag (pointer-events: none). -->
      <section id="hud" class="screen screen--hud" hidden>
        <div class="screen__inner">
          <div class="hud__stack">
            <div class="hud__top">
              <!-- Triple-tap target during a run; see the wordmark above. -->
              <div id="hud-level" class="hud__level">Level 1</div>

              <!-- The badge is absolutely placed so the count stays optically
                   centred however long the staff name is. A swap animates it;
                   the full-screen staff name it used to trigger is gone. -->
              <div class="hud__countwrap">
                <div id="hud-count" class="hud__count">0</div>
                <span id="hud-staff" class="hud__staff" data-staff="ember">Ember</span>
              </div>

              <button
                id="mute-hud"
                class="mute mute--hud"
                type="button"
                aria-label="Sound"
                aria-pressed="false"
              >
                <svg class="mute__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <path class="mute__horn" d="M4 9h4l5-4v14l-5-4H4z" />
                  <path class="mute__wave" d="M16.2 8.4a5 5 0 0 1 0 7.2" />
                  <path class="mute__wave" d="M18.6 6a8.5 8.5 0 0 1 0 12" />
                  <path class="mute__slash" d="M4 3.5 21 20.5" />
                </svg>
              </button>
            </div>

            <div id="boss-bar" class="boss" hidden>
              <div class="boss__head">
                <span id="boss-bar-label" class="boss__label">Boss</span>
                <span id="boss-bar-value" class="boss__value">0 / 0</span>
              </div>
              <div class="boss__track"><div id="boss-bar-fill" class="boss__fill"></div></div>
            </div>
          </div>
        </div>
      </section>

      <!-- Result: coins earned, survivors, peak count, Ascend / Again / Levels. -->
      <section id="result-screen" class="screen screen--result" hidden>
        <div class="screen__inner">
          <div class="screen__top">
            <p id="result-kicker" class="result__kicker">Horde slain</p>
            <h2 id="result-title" class="screen__title screen__title--result">Level 1</h2>
            <p id="result-first-clear" class="result__badge" hidden>First clear</p>
          </div>

          <div class="screen__middle">
            <dl class="stats">
              <div class="stats__row stats__row--coins">
                <dt class="stats__key">Coins</dt>
                <dd class="stats__value">
                  <span class="coins__icon coins__icon--inline" aria-hidden="true"></span>
                  <span id="result-coins">0</span>
                </dd>
              </div>
              <div class="stats__row">
                <dt class="stats__key">Survivors</dt>
                <dd id="result-survivors" class="stats__value">0</dd>
              </div>
              <div class="stats__row">
                <dt class="stats__key">Peak</dt>
                <dd id="result-peak" class="stats__value">0</dd>
              </div>
            </dl>
            <p class="result__total">Purse <span id="result-total">0</span></p>
          </div>

          <div class="screen__actions">
            <button id="next-button" class="button" type="button" hidden>Ascend</button>
            <button id="retry-button" class="button button--ghost" type="button">Again</button>
            <button id="levels-button" class="button button--ghost" type="button">Academy</button>
          </div>
        </div>
      </section>

      <!-- Win confetti. Last before the debug panel so it paints over the result. -->
      <canvas id="confetti" hidden></canvas>

      <!-- ?debug, or a triple-tap on the wordmark or the level chip. Monospace,
           bottom-left; only the capture button takes pointer events. -->
      <div id="debug-panel" class="debug" hidden>
        <pre id="debug-text" class="debug__text"></pre>
        <pre id="debug-capture" class="debug__capture" hidden></pre>
        <button id="debug-capture-button" class="debug__button" type="button">Capture 10s</button>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
