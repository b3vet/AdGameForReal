<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="color-scheme" content="light" />
    <meta name="description" content="Arcane Rush: a portrait lane-defense auto-shooter." />
    <title>Arcane Rush</title>
  </head>
  <body>
    <canvas id="game-canvas" touch-action="none"></canvas>

    <!--
      The icon sprite (Milestone 5, Phase D). Every glyph the overlay draws is
      here once and referenced with `<use>`; `src/ui/icons.ts` builds those
      references and says which icon belongs to which room, drill and staff.

      Drawn rather than downloaded: Kenney's Game Icons is a set of interface
      glyphs — gamepads, arrows, volume — and what this game needs is a coin,
      three staffs, five drills, a wisp and four rooms. A path is also exact at
      any pixel ratio, which a 48 px PNG on a 3x phone is not, and it costs no
      request in any build.

      Two tones per icon and no more: `currentColor` takes the colour of
      whatever the icon sits in, and a secondary shape carries `opacity` rather
      than a second colour, so one CSS variable dresses the whole set.
    -->
    <svg id="ui-sprite" aria-hidden="true" focusable="false" width="0" height="0">
      <defs>
        <symbol id="i-coin" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="9.2" />
          <circle cx="12" cy="12" r="6.4" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.45" />
          <path opacity="0.45" d="M12 7.4 13.2 10.8 16.6 12 13.2 13.2 12 16.6 10.8 13.2 7.4 12 10.8 10.8Z" />
        </symbol>

        <!-- The three staffs share a shaft and differ only in the head, so a
             glance at the HUD plaque says which one is in hand. -->
        <symbol id="i-staff-ember" viewBox="0 0 24 24">
          <path d="M6.4 21 13.2 10.6" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" />
          <path d="M16.6 2.4c2.7 2 3.8 3.9 3.8 5.8a3.8 3.8 0 0 1-7.6 0c0-1.6 1-2.8 1.7-3.5.1 1.2.8 1.8 1.4 1.8.9 0 1.3-.9.7-4.1Z" />
        </symbol>
        <symbol id="i-staff-storm" viewBox="0 0 24 24">
          <path d="M6.4 21 13.2 10.6" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" />
          <path d="M18.4 1.8 11.9 10.4h3.4L13.6 18l6.5-8.9h-3.5l1.8-7.3Z" />
        </symbol>
        <symbol id="i-staff-frost" viewBox="0 0 24 24">
          <path d="M6.4 21 13.2 10.6" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" />
          <path d="M16.5 1.9 20.6 7l-4.1 5.1L12.4 7l4.1-5.1Z" />
          <path opacity="0.5" d="M16.5 4.2 18.3 7l-1.8 2.8L14.7 7l1.8-2.8Z" />
        </symbol>

        <!-- The five drills of the Training Yard. -->
        <symbol id="i-drill-damage" viewBox="0 0 24 24">
          <path d="M12 1.4 14.3 7.6 20.5 5.4 17.4 11.2 22.6 15.1 16.1 15.9 16.6 22.4 12 17.8 7.4 22.4 7.9 15.9 1.4 15.1 6.6 11.2 3.5 5.4 9.7 7.6 12 1.4Z" />
        </symbol>
        <symbol id="i-drill-fire-rate" viewBox="0 0 24 24">
          <path
            d="M4.6 4.4 12 12l-7.4 7.6M12.6 4.4 20 12l-7.4 7.6"
            fill="none"
            stroke="currentColor"
            stroke-width="2.6"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </symbol>
        <symbol id="i-drill-recruits" viewBox="0 0 24 24">
          <g opacity="0.5">
            <path d="M6.6 5.4 10.3 14H2.9L6.6 5.4Z" />
            <rect x="1.6" y="14.3" width="10" height="2.4" rx="1.2" />
          </g>
          <path d="M15.2 3.6 20.6 16H9.8L15.2 3.6Z" />
          <rect x="8.4" y="16.3" width="13.6" height="2.9" rx="1.45" />
        </symbol>
        <symbol id="i-drill-sigil" viewBox="0 0 24 24">
          <path d="M12 1.6 22.4 12 12 22.4 1.6 12 12 1.6Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" />
          <path d="M12 7.2v9.6M7.2 12h9.6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" />
        </symbol>
        <symbol id="i-drill-slayer" viewBox="0 0 24 24">
          <path
            d="M5.2 8.6C3.8 7.1 3.3 5.4 3.9 3.6c1.8.7 3.1 1.9 3.9 3.5M18.8 8.6c1.4-1.5 1.9-3.2 1.3-5-1.8.7-3.1 1.9-3.9 3.5"
            fill="none"
            stroke="currentColor"
            stroke-width="1.9"
            stroke-linecap="round"
          />
          <path
            d="M4.9 12.4a7.1 7.1 0 0 1 14.2 0c0 2.3-1 4-2.4 5v2.1a2 2 0 0 1-2 2H9.3a2 2 0 0 1-2-2v-2.1c-1.4-1-2.4-2.7-2.4-5Z"
            fill="none"
            stroke="currentColor"
            stroke-width="1.9"
            stroke-linejoin="round"
          />
          <circle cx="9.4" cy="12.6" r="1.7" />
          <circle cx="14.6" cy="12.6" r="1.7" />
        </symbol>

        <symbol id="i-wisp" viewBox="0 0 24 24">
          <ellipse
            cx="12"
            cy="12"
            rx="9.4"
            ry="4.2"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            opacity="0.5"
            transform="rotate(-22 12 12)"
          />
          <circle cx="12" cy="12" r="3.6" />
          <circle cx="19.4" cy="6.2" r="1.3" opacity="0.6" />
          <circle cx="4.9" cy="17.6" r="1" opacity="0.45" />
        </symbol>

        <!-- The Academy's rooms. -->
        <symbol id="i-room-play" viewBox="0 0 24 24">
          <path opacity="0.4" d="M12 1.4 22.6 12 12 22.6 1.4 12 12 1.4Z" />
          <path d="M9.2 6.6 17.6 12l-8.4 5.4V6.6Z" />
        </symbol>
        <symbol id="i-room-yard" viewBox="0 0 24 24">
          <path
            d="M4.4 19.6 17.2 6.8M19.6 19.6 6.8 6.8"
            fill="none"
            stroke="currentColor"
            stroke-width="2.3"
            stroke-linecap="round"
          />
          <path d="M17.8 2.4 21.6 6.2 18.6 9.2 14.8 5.4 17.8 2.4Z" opacity="0.6" />
          <path d="M6.2 2.4 9.2 5.4 5.4 9.2 2.4 6.2 6.2 2.4Z" opacity="0.6" />
        </symbol>
        <symbol id="i-room-workbench" viewBox="0 0 24 24">
          <path d="M2.6 7.4h10.8c1.7 0 3-.9 3.8-2.6l2.2 1c-.8 2.7-2.6 4.4-5.2 5.1l1.4 3.5H8l1.3-3.4H6.4l-3.8 2.2V7.4Z" />
          <rect x="5.4" y="17.2" width="13.2" height="2.8" rx="1" />
          <rect x="9" y="14.4" width="6" height="2.6" opacity="0.55" />
        </symbol>
        <symbol id="i-room-sanctum" viewBox="0 0 24 24">
          <path
            d="M5 20.4V11a7 7 0 0 1 14 0v9.4"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          />
          <path d="M13.6 6.6c1.8 1.4 2.6 2.7 2.6 4a4.2 4.2 0 0 1-8.4 0c0-1.1.7-1.9 1.2-2.4.1.8.5 1.2 1 1.2.6 0 .9-.6.5-2.8Z" opacity="0.85" />
        </symbol>
        <symbol id="i-room-bestiary" viewBox="0 0 24 24">
          <path
            d="M12 6.6C9.4 5 6.5 4.6 3.4 5.6v12.6c3.1-1 6-.6 8.6 1 2.6-1.6 5.5-2 8.6-1V5.6c-3.1-1-6-.6-8.6 1Z"
            fill="none"
            stroke="currentColor"
            stroke-width="1.9"
            stroke-linejoin="round"
          />
          <path d="M12 6.6v12.6" fill="none" stroke="currentColor" stroke-width="1.6" opacity="0.6" />
        </symbol>

        <!-- The Wardrobe (D53): a hat on a stand, which is the one thing every
             slot in that room has in common with the mage wearing it. -->
        <symbol id="i-room-wardrobe" viewBox="0 0 24 24">
          <path d="M12 2.2c3.1 2.4 4.8 4.9 4.8 7.4 0 1.1-.3 2-.8 2.8H8c-.5-.8-.8-1.7-.8-2.8 0-2.5 1.7-5 4.8-7.4Z" />
          <path d="M3.4 15.4c2.4-1.4 5.3-2.1 8.6-2.1s6.2.7 8.6 2.1l-1 2.4c-2.2-1.2-4.7-1.8-7.6-1.8s-5.4.6-7.6 1.8l-1-2.4Z" opacity="0.55" />
          <rect x="4.6" y="19" width="14.8" height="2.4" rx="1.2" opacity="0.4" />
        </symbol>

        <!-- The star a well-walked level wears in the picker, and the sheet. -->
        <symbol id="i-star" viewBox="0 0 24 24">
          <path d="M12 2.2 15 9.1l7.4.6-5.6 4.9 1.7 7.2L12 18l-6.5 3.8 1.7-7.2L1.6 9.7 9 9.1 12 2.2Z" />
        </symbol>

        <!-- The streak (D51): a day's flame, one per day walked. -->
        <symbol id="i-streak" viewBox="0 0 24 24">
          <path d="M13.6 1.6c4.2 3.3 6.2 6.3 6.2 9.3a7.8 7.8 0 0 1-15.6 0c0-2.6 1.6-4.6 2.8-5.8.2 2 1.3 3 2.3 3 1.4 0 2.1-1.5 1.2-6.5Z" />
          <path d="M12.4 12.2c1.9 1.5 2.8 2.9 2.8 4.2a3.2 3.2 0 0 1-6.4 0c0-1.1.7-2 1.3-2.5.1.8.5 1.3 1 1.3.6 0 .9-.6.3-3Z" opacity="0.45" />
        </symbol>

        <!-- Endless (D52): a road that comes back round to itself. -->
        <symbol id="i-endless" viewBox="0 0 24 24">
          <path
            d="M6.2 7.2c2.8 0 3.9 2.2 5.8 4.8 1.9 2.6 3 4.8 5.8 4.8a4.8 4.8 0 0 0 0-9.6c-2.8 0-3.9 2.2-5.8 4.8-1.9 2.6-3 4.8-5.8 4.8a4.8 4.8 0 0 1 0-9.6Z"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linejoin="round"
          />
        </symbol>

        <symbol id="i-lock" viewBox="0 0 24 24">
          <rect x="4.6" y="10.4" width="14.8" height="10" rx="2.2" />
          <path
            d="M8.2 10.4V7.8a3.8 3.8 0 0 1 7.6 0v2.6"
            fill="none"
            stroke="currentColor"
            stroke-width="2.1"
          />
        </symbol>
      </defs>
    </svg>

    <div id="overlay-root">
      <!--
        The Academy home, which replaced the title screen in Milestone 4
        (decision D33). It keeps the id `#title-screen` and the wordmark's
        `#title-wordmark`: the first is what every screen switch and the smoke
        test already know this screen by, and the second is a triple-tap target
        for the debug panel (src/ui/taps.ts).

        The room cards are built by src/ui/academy.ts from src/data/academy.json
        so the copy, the order and the unlock levels stay out of the markup.
      -->
      <section id="title-screen" class="screen screen--academy">
        <div class="screen__inner">
          <div class="academy__bar">
            <div id="academy-coins" class="coins frame frame--inset">
              <span class="icon coins__icon" aria-hidden="true"
                ><svg viewBox="0 0 24 24"><use href="#i-coin" /></svg
              ></span>
              <span id="academy-coin-value" class="coins__value">0</span>
            </div>

            <!-- The daily streak (D51). A plaque rather than a button: it is
                 advanced by finishing a road, never by tapping. -->
            <div id="academy-streak" class="streak frame frame--inset" data-started="false">
              <span class="icon streak__icon" aria-hidden="true"
                ><svg viewBox="0 0 24 24"><use href="#i-streak" /></svg
              ></span>
              <span id="streak-days" class="streak__days"></span>
              <span id="streak-hint" class="streak__hint"></span>
            </div>
          </div>

          <div class="screen__top">
            <!--
              The logo treatment (Milestone 5): a gold gradient poured into the
              letterforms, an ink stroke cut around them by the `::before` copy
              underneath, and a soft shadow under both. `data-text` is what that
              copy renders, so it has to stay in step with the heading — the
              non-breaking space is a CSS `white-space` rule now, not a markup
              one, because an attribute cannot carry an entity reliably.
            -->
            <h1 id="title-wordmark" class="screen__title wordmark" data-text="Arcane Rush">
              Arcane Rush
            </h1>
          </div>

          <!-- One parchment board over the lit road, as on the old title: the
               dressed scene behind it is the shop window, and light-on-light
               was unreadable. Inert like the rest of the overlay; only the
               cards take pointer events. -->
          <div class="screen__panel frame frame--panel">
            <div id="academy-cards" class="cards"></div>

            <!-- The missions board (D51): three cards, built by src/ui/board.ts
                 from the three the save is carrying. Read-only, like the
                 plaque above it. -->
            <h2 id="missions-heading" class="board__heading">Missions</h2>
            <div id="academy-missions" class="board"></div>
          </div>
        </div>

        <!-- Mute lives here and in the HUD corner; both drive the save. -->
        <button
          id="mute-title"
          class="mute mute--title"
          type="button"
          aria-label="Sound"
          aria-pressed="false"
        >
          <svg class="mute__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path class="mute__horn" d="M4 9h4l5-4v14l-5-4H4z" />
            <path class="mute__wave" d="M16.2 8.4a5 5 0 0 1 0 7.2" />
            <path class="mute__wave" d="M18.6 6a8.5 8.5 0 0 1 0 12" />
            <path class="mute__slash" d="M4 3.5 21 20.5" />
          </svg>
        </button>
      </section>

      <!-- Level picker, behind the Academy's Play card. Two pages of ten; the
           page tabs hide themselves while there is only one page.
           scripts/smoke-run.mjs clicks #play-button — keep that id stable. -->
      <section id="levels-screen" class="screen screen--levels" hidden>
        <div class="screen__inner">
          <div class="screen__top">
            <h2 class="screen__title screen__title--panel">Levels</h2>
            <div class="flourish" aria-hidden="true"></div>
          </div>

          <div class="screen__panel frame frame--panel">
            <div class="screen__middle">
              <!-- Endless (D52): a mode beside the campaign, so it stands above
                   the chips rather than among them. -->
              <div id="picker-endless" class="endless frame frame--card">
                <span class="icon endless__icon" aria-hidden="true"
                  ><svg viewBox="0 0 24 24"><use href="#i-endless" /></svg
                ></span>
                <span class="endless__body">
                  <span id="endless-title" class="endless__title">Endless</span>
                  <span id="endless-blurb" class="endless__blurb">One road, no end.</span>
                  <span id="endless-best" class="endless__best"></span>
                </span>
                <button id="endless-button" class="button button--row" type="button">
                  Endless
                </button>
              </div>

              <p id="picker-caption" class="picker__caption">Level</p>
              <!-- Filled by src/ui/picker.ts from the save's unlocked level. -->
              <div id="level-picker" class="picker"></div>
              <div id="picker-pages" class="pager"></div>
            </div>

            <div class="screen__actions">
              <button id="play-button" class="button" type="button">Play</button>
              <button id="levels-back" class="button button--ghost" type="button">Back</button>
            </div>
          </div>
        </div>
      </section>

      <!-- The four rooms share one screen: the heading, the coin chip and the
           Back button are the same furniture, and only the body swaps. Each
           room's body is built once, on the first visit, by src/ui/rooms.ts. -->
      <section id="room-screen" class="screen screen--room" hidden>
        <div class="screen__inner">
          <div class="room__bar">
            <div id="room-coins" class="coins frame frame--inset">
              <span class="icon coins__icon" aria-hidden="true"
                ><svg viewBox="0 0 24 24"><use href="#i-coin" /></svg
              ></span>
              <span id="room-coin-value" class="coins__value">0</span>
            </div>
          </div>

          <div class="screen__top">
            <h2 id="room-title" class="screen__title screen__title--panel">Yard</h2>
            <div class="flourish" aria-hidden="true"></div>
            <p id="room-subtitle" class="room__subtitle"></p>
          </div>

          <div class="screen__panel frame frame--panel room__panel">
            <div id="yard-rows" class="rows" hidden></div>
            <div id="workbench-cards" class="rows" hidden></div>
            <div id="sanctum-card" class="rows" hidden></div>
            <div id="bestiary-cards" class="beasts" hidden></div>
            <!-- The Wardrobe (D53): four rows of tint chips, one per slot. -->
            <div id="wardrobe-rows" class="rows rows--tints" hidden></div>
          </div>

          <div class="screen__actions">
            <button id="room-back" class="button button--ghost" type="button">Back</button>
          </div>
        </div>
      </section>

      <!-- HUD: count, staff badge, boss bar, level chip, mute — and nothing
           else (docs/09-milestone-3-plan.md, "UI text, font"). Informational
           only, so it never eats a drag (pointer-events: none). -->
      <section id="hud" class="screen screen--hud" hidden>
        <div class="screen__inner">
          <div class="hud__stack">
            <div class="hud__top">
              <!-- Triple-tap target during a run; see the wordmark above. -->
              <div id="hud-level" class="hud__level">Level 1</div>

              <!-- The badge is absolutely placed so the plaque stays optically
                   centred however long the staff name is. A swap animates it;
                   the full-screen staff name it used to trigger is gone. -->
              <div class="hud__countwrap">
                <div id="hud-plaque" class="hud__plaque frame frame--plaque" data-staff="ember">
                  <span id="hud-staff-icon" class="icon hud__stafficon" aria-hidden="true"
                    ><svg viewBox="0 0 24 24"><use href="#i-staff-ember" /></svg
                  ></span>
                  <div id="hud-count" class="hud__count">0</div>
                </div>
                <span id="hud-staff" class="hud__staff" data-staff="ember">Ember</span>
              </div>

              <button
                id="mute-hud"
                class="mute mute--hud"
                type="button"
                aria-label="Sound"
                aria-pressed="false"
              >
                <svg class="mute__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <path class="mute__horn" d="M4 9h4l5-4v14l-5-4H4z" />
                  <path class="mute__wave" d="M16.2 8.4a5 5 0 0 1 0 7.2" />
                  <path class="mute__wave" d="M18.6 6a8.5 8.5 0 0 1 0 12" />
                  <path class="mute__slash" d="M4 3.5 21 20.5" />
                </svg>
              </button>
            </div>

            <div id="boss-bar" class="boss frame frame--bar" hidden>
              <div class="boss__head">
                <span id="boss-bar-label" class="boss__label">Boss</span>
                <span id="boss-bar-value" class="boss__value">0 / 0</span>
              </div>
              <div class="boss__track">
                <div id="boss-bar-fill" class="boss__fill"></div>
                <span class="boss__gem" aria-hidden="true"></span>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- Result: coins earned, survivors, peak count, Ascend / Again / Levels. -->
      <section id="result-screen" class="screen screen--result" hidden>
        <div class="screen__inner">
          <div class="screen__top">
            <!-- The ribbon is the headline: it slides in, carries the verdict,
                 and turns crimson when the run was lost (`data-won`). -->
            <div id="result-ribbon" class="ribbon" data-won="true">
              <p id="result-kicker" class="ribbon__text">Horde slain</p>
            </div>
            <h2 id="result-title" class="screen__title screen__title--result">Level 1</h2>
            <p id="result-first-clear" class="result__badge" hidden>First clear</p>
          </div>

          <div class="screen__middle">
            <dl class="stats">
              <div class="stats__row stats__row--coins frame frame--card">
                <dt class="stats__key">
                  <span class="icon stats__icon" aria-hidden="true"
                    ><svg viewBox="0 0 24 24"><use href="#i-coin" /></svg
                  ></span>
                  Coins
                </dt>
                <dd class="stats__value">
                  <span id="result-coins">0</span>
                </dd>
              </div>
              <!-- Endless only (D52): metres walked, and the record. The row
                   is hidden on a campaign run, where the level is the score. -->
              <div id="result-metres-row" class="stats__row frame frame--card" hidden>
                <dt class="stats__key">
                  <span class="icon stats__icon" aria-hidden="true"
                    ><svg viewBox="0 0 24 24"><use href="#i-endless" /></svg
                  ></span>
                  Metres
                </dt>
                <dd class="stats__value">
                  <span id="result-metres">0</span>
                  <span id="result-best-metres" class="stats__note"></span>
                </dd>
              </div>

              <div class="stats__row frame frame--card">
                <dt class="stats__key">
                  <span class="icon stats__icon" aria-hidden="true"
                    ><svg viewBox="0 0 24 24"><use href="#i-drill-recruits" /></svg
                  ></span>
                  Survivors
                </dt>
                <dd id="result-survivors" class="stats__value">0</dd>
              </div>
              <div class="stats__row frame frame--card">
                <dt class="stats__key">
                  <span class="icon stats__icon" aria-hidden="true"
                    ><svg viewBox="0 0 24 24"><use href="#i-drill-damage" /></svg
                  ></span>
                  Peak
                </dt>
                <dd id="result-peak" class="stats__value">0</dd>
              </div>
            </dl>
            <!-- What the meta layer paid on top of the road (D51 to D53):
                 the streak, the missions this run finished, the bestiary rungs
                 it crossed. Built by src/ui/resultMeta.ts; empty when the run
                 earned none of them. -->
            <div id="result-bonuses" class="bonuses" hidden></div>

            <p id="result-best" class="result__best" hidden></p>

            <p class="result__total">Purse <span id="result-total">0</span></p>

            <!-- The nearest thing the Academy still sells, against the purse
                 the run has just filled. -->
            <div id="result-next" class="unlock frame frame--inset" hidden>
              <span id="result-next-heading" class="unlock__heading">Next unlock</span>
              <span id="result-next-name" class="unlock__name"></span>
              <span class="unlock__price">
                <span class="icon unlock__coin" aria-hidden="true"
                  ><svg viewBox="0 0 24 24"><use href="#i-coin" /></svg
                ></span>
                <span id="result-next-price">0</span>
              </span>
              <span id="result-next-short" class="unlock__short"></span>
            </div>
          </div>

          <div class="screen__actions">
            <button id="next-button" class="button" type="button" hidden>Ascend</button>
            <button id="replay-button" class="button button--ghost" type="button">
              Same road again
            </button>
            <button id="retry-button" class="button button--ghost" type="button">Again</button>
            <button id="levels-button" class="button button--ghost" type="button">Academy</button>
          </div>
        </div>
      </section>

      <!-- Win confetti. Last before the debug panel so it paints over the result. -->
      <canvas id="confetti" hidden></canvas>

      <!-- ?debug, or a triple-tap on the wordmark or the level chip. Monospace,
           bottom-left; only the capture button takes pointer events. -->
      <div id="debug-panel" class="debug" hidden>
        <pre id="debug-text" class="debug__text"></pre>
        <pre id="debug-capture" class="debug__capture" hidden></pre>
        <button id="debug-capture-button" class="debug__button" type="button">Capture 10s</button>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
